spring:
  application:
    name: library

  datasource:
    # Данные для Docker контейнера PostgreSQL 17
    url: jdbc:postgresql://localhost:5433/library?currentSchema=dmitry
    username: dmitry
    password: password
    driver-class-name: org.postgresql.Driver
    # Данные для локальной PostgreSQL 17
    #    url: jdbc:postgresql://localhost:5432/library_db
    #    username: library_user
    #    password: library_password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 9090

# Правильные значения для уровней логирования
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.springframework: WARN     # ← WARN, а не WARNING
    ru.library: INFO              # ваш пакет